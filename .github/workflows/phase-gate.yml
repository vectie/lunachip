name: phase-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned MoonBit toolchain
        uses: hustcer/setup-moonbit@1522f9aef02a8ca0187dfc00a41f5dd6b16750f7 # v1.23
        with:
          version: 0.10.6+62c2592d1
          core-version: 0.10.6+62c2592d1

      - name: Record bootstrap versions
        run: moon version --all

      - name: Run repository phase gate
        run: scripts/phase-gate.sh

      - name: Verify generated interfaces and formatting are committed
        run: git diff --exit-code
